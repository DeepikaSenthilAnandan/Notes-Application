<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div>
            <h1>📝 Notes App</h1>
            <p>Write it. Save it. Remember it.</p>
        </div>

        <button id="themeBtn" class="theme-btn">🌙</button>
    </header>

    <main class="container">

        <!-- Search -->
        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search notes..."
            >
        </div>

        <!-- Add Note -->
        <section class="note-form">

            <input
                type="text"
                id="titleInput"
                placeholder="Note title"
                maxlength="100"
            >

            <textarea
                id="contentInput"
                placeholder="Write your note here..."
            ></textarea>

            <button id="saveBtn" class="save-btn">
                ➕ Add Note
            </button>

            <button id="cancelBtn" class="cancel-btn hidden">
                Cancel
            </button>

        </section>

        <!-- Notes -->
        <section>
            <div class="notes-header">
                <h2>My Notes</h2>
                <span id="noteCount">0 notes</span>
            </div>

            <div id="notesContainer" class="notes-container">
                <!-- Notes will appear here -->
            </div>

            <div id="emptyMessage" class="empty-message">
                <div>📭</div>
                <h3>No notes found</h3>
                <p>Create your first note above.</p>
            </div>
        </section>

    </main>

    <footer>
        <p>Made with ❤️ using HTML, CSS & JavaScript</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
